# Render Blueprint: one web service (API + web app) and a Postgres database.
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: loan-risk-analyzer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # random JWT signing key
      - key: ADMIN_INVITE_CODE
        generateValue: true          # code to register bank-officer accounts (see dashboard)
      - key: DATABASE_URL
        fromDatabase:
          name: loan-risk-db
          property: connectionString

databases:
  - name: loan-risk-db
    plan: free
    databaseName: loan_analyzer
    user: loan
