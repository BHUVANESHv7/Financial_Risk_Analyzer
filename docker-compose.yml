# The whole product (API + web app) with PostgreSQL, on one machine.
#
#   1. Create a .env file next to this one:
#        SECRET_KEY=<python -c "import secrets; print(secrets.token_hex(32))">
#        ADMIN_INVITE_CODE=<a code for officer sign-up>
#        POSTGRES_PASSWORD=<a strong password>
#   2. docker compose up -d --build
#   3. Open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loan_analyzer
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loan_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: postgresql://loan:${POSTGRES_PASSWORD}@db:5432/loan_analyzer
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:-}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  db_data:
