services:
  - type: web
    name: loan-risk-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true        # Render creates a random secret
      - key: ADMIN_INVITE_CODE
        sync: false                # set in the Render dashboard
      - key: DATABASE_URL
        sync: false                # e.g. a Render Postgres URL (SQLite is used if empty)
