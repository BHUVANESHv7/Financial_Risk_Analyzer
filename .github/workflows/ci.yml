name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loan_test
          POSTGRES_USER: loan
          POSTGRES_PASSWORD: loan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loan" --health-interval 5s
          --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.2.0 httpx==0.27.0
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://loan:loan@localhost:5432/loan_test' || '' }}
        # On failure, the tail of the output is also shown as an annotation on the run page.
        run: |
          set +e
          python -m pytest -q --tb=short -rfE 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 60 pytest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest failed (${{ matrix.db }})::$msg"
          fi
          exit $code

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0   # same version the app is developed with
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build web
        run: flutter build web --no-tree-shake-icons

  # Builds the production image and tests the whole product end to end against
  # PostgreSQL, the same way it runs on Render or with docker compose.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, flutter]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loan_analyzer
          POSTGRES_USER: loan
          POSTGRES_PASSWORD: loan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loan" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: |
          set +e
          docker build --progress=plain -t loan-risk . 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -v '^#[0-9]* sha256\|DONE\|CACHED' build.log | tail -n 50 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=docker build failed::$msg"
          fi
          exit $code
      - name: Start container in production mode
        run: |
          docker run -d --name app --network host \
            -e PORT=8080 \
            -e SECRET_KEY=ci-secret-0123456789abcdef0123456789 \
            -e ADMIN_INVITE_CODE=ci-officer \
            -e DATABASE_URL=postgres://loan:loan@localhost:5432/loan_analyzer \
            loan-risk
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/health; then exit 0; fi
            sleep 2
          done
          echo "App did not become healthy"; docker logs app; exit 1
      - name: Smoke test
        run: python3 .github/smoke_test.py http://localhost:8080 ci-officer postgresql
      - name: Container logs
        if: always()
        run: docker logs app 2>&1 || true
